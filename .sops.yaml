# Destinatários de secrets/*.sops (scripts/segredos.sh). Cada entrada é uma chave SSH pública (o age
# aceita ssh-rsa e ssh-ed25519); a chave privada correspondente decifra. Para incluir/remover: edite a
# lista, rode 'scripts/segredos.sh rekey' e faça commit. Remover uma chave não revoga o que ela já
# decifrou: rotacione.
creation_rules:
  - path_regex: (^|/)secrets/.+\.sops$
    age: >-
      ssh-rsa 
