# Portão do túnel de desenvolvimento: só o webhook de pagamentos sai para a internet.
# O resto do app local (que pode ter cópia de dados de produção) responde 404 pelo túnel.
server {
    listen 8080;
    resolver 127.0.0.11 valid=10s;
    set $app http://web:8000;

    location = /webhooks/pagamentos {
        limit_except POST { deny all; }
        proxy_pass $app;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
