# DEV LOCAL APENAS: leva o webhook do Asaas sandbox até o `web` local. Uso: scripts/tunel-webhook.sh
services:
  webhook-gate:
    image: nginx:1.29-alpine
    container_name: defonline-webhook-gate
    volumes:
      - ./infra/tunel-webhook:/etc/nginx/conf.d-src:ro
    command: sh -c "cp /etc/nginx/conf.d-src/nginx.conf /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"

  webhook-tunnel:
    image: cloudflare/cloudflared:2025.10.0
    container_name: defonline-webhook-tunnel
    command: tunnel --no-autoupdate --url http://webhook-gate:8080
    depends_on:
      - webhook-gate
