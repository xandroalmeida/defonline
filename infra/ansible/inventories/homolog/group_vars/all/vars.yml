---
# Variáveis públicas (não-secretas) do ambiente homologação.
# Senhas, tokens e chaves vivem em `vault.yml` (cifrado por Ansible Vault).

env_name: homolog
app_domain: defonline.xandrix.com.br
app_url: "https://{{ app_domain }}"
app_version: "rc-placeholder"          # sobrescrito por -e image_tag=... no CI
app_env: staging
app_debug: false
log_level: debug                       # RNF §6.1 — debug em staging
app_locale: pt_BR

# Topologia (ADR-002 + ADR-005)
deploy_user: deploy
deploy_dir: /opt/defonline
repo_url: "git@github.com:xandroalmeida/defonline.git"
repo_branch: main                      # imagem vem de tag git; código só serve para compose/Caddyfile
container_registry: ghcr.io
container_image: xandroalmeida/defonline/app

# Chave pública instalada no authorized_keys do usuário `deploy` pelo bootstrap.yml.
# Par privado em `secrets/deploy-homolog.key` (gitignored) — usado pelo CI e pelo dev.
# Caminho relativo ao playbook (infra/ansible/playbooks) → raiz do repo.
deploy_authorized_key_path: "{{ playbook_dir }}/../../../secrets/deploy-homolog.key.pub"

# DNS Cloudflare (ADR-005 §3 + §"Pós-MVP: automatizar via cloudflare_dns").
# A zona xandrix.com.br já é autoritativa na Cloudflare (dina/corey.ns.cloudflare.com).
# `proxied: false` é obrigatório, não preferência: o Caddy emite o certificado
# Let's Encrypt via desafio HTTP-01, e o proxy laranja termina o TLS na borda da
# Cloudflare, quebrando a emissão. ADR-005 §"Modo proxy desligado no MVP".
cloudflare_zone: xandrix.com.br
cloudflare_record_proxied: false
cloudflare_record_ttl: 300
cloudflare_api_token: "{{ vault_cloudflare_api_token }}"

# Postgres (ADR-001 + ADR-003 + ADR-005)
postgres_image: postgres:18-alpine
postgres_db: defonline
postgres_user: defonline_app           # role da app (least privilege — ADR-005 §7.4)
postgres_backup_user: defonline_backup
postgres_superuser: postgres

# Caddy (ADR-005 §3)
caddy_image: caddy:2-alpine
caddy_admin_email: "alex@xandrix.com.br"

# Mail — provedor Resend (IDR-007, 2026-05-24).
# Domínio verificado no painel Resend: xandrix.com.br (raiz). Por isso o
# MAIL_FROM_ADDRESS sai como noreply@xandrix.com.br — Resend rejeita From
# de domínios não verificados (mesmo subdomínios). Se um dia verificarmos
# defonline.xandrix.com.br especificamente, basta remover este override
# que o env.j2 cai no padrão `noreply@{{ app_domain }}`.
mail_mailer: resend
mail_from_address: "noreply@xandrix.com.br"
resend_api_key: "{{ vault_resend_api_key }}"

# Cloudflare R2 (ADR-005 §4.2 — backup off-site; provedor revisado em 2026-08-04,
# antes Backblaze B2 — ver IDR no rodapé da ADR).
# Bucket e credencial são POR AMBIENTE: o token gravado no vault de homologação
# é escopado só em `defonline-backup-homolog` e não enxerga o bucket de produção.
r2_bucket: defonline-backup-homolog
# Pinado e instalado do .deb oficial, não do apt: a 1.60.1-DEV do Ubuntu 26.04
# falha contra a R2 (HEAD com ?versionId= → 501). Motivo completo em backup.yml.
rclone_version: "1.75.0"
backup_retention_daily: 30
backup_retention_monthly: 12           # meses (o script converte para dias × 31)
backup_cron_minute: "0"
backup_cron_hour: "3"                  # 03:00 BRT

# Verificação diária (pg-backup-verify.sh): confere na R2 que existe dump recente,
# baixa, decifra e passa pelo pg_restore --list. Roda depois da janela do backup.
# Alerta no Telegram em qualquer falha — inclusive a ausência de execução, que o
# próprio pg-backup.sh não consegue reportar sobre si mesmo.
backup_verify_cron_minute: "30"
backup_verify_cron_hour: "4"           # 04:30 BRT
backup_max_idade_horas: 26             # 24h + folga para atraso do cron
backup_verify_resumo_semanal: true     # 1 mensagem/semana provando que o canal vive
backup_verify_resumo_dia_semana: "1"   # 1 = segunda-feira (date +%u)

# Heartbeat / observabilidade (ADR-004)
telegram_chat_id: "{{ vault_telegram_chat_id_homolog }}"
telegram_bot_token: "{{ vault_telegram_bot_token }}"

# RFB (STORY-018 / IDR-004 / IDR-005 / IDR-006).
# Em homol: `cnpja` no plano pago (api.cnpja.com) — IDR-005 escolheu cnpja como
# primário; a chave vem do vault. RPM default 30 (placeholder de plano pago;
# ajustar quando contratar definitivo). Receitaws fica desligado nesta janela —
# entra se decidirmos rodar A/B observacional (IDR-004 §"permitir A/B").
rfb_provider: "cnpja"
rfb_timeout: 5
rfb_cache_ttl: 300
rfb_cnpja_base_url: "https://api.cnpja.com"
rfb_cnpja_api_key: "{{ vault_rfb_cnpja_api_key }}"
rfb_cnpja_rate_limit_per_minute: 30
rfb_receitaws_base_url: "https://receitaws.com.br/v1"
rfb_receitaws_api_key: "{{ vault_rfb_receitaws_api_key }}"
rfb_receitaws_rate_limit_per_minute: 3

# Segredos referenciados aqui — definidos em `group_vars/vault.yml` (cifrado).
db_app_password: "{{ vault_db_app_password }}"
db_backup_password: "{{ vault_db_backup_password }}"
db_superuser_password: "{{ vault_db_superuser_password }}"
r2_account_id: "{{ vault_r2_account_id }}"
r2_access_key_id: "{{ vault_r2_access_key_id }}"
r2_secret_access_key: "{{ vault_r2_secret_access_key }}"
backup_gpg_passphrase: "{{ vault_backup_gpg_passphrase }}"
ghcr_pull_token: "{{ vault_ghcr_pull_token }}"
