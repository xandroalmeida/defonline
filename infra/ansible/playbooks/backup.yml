---
# Backup off-site Postgres → GPG → Cloudflare R2 (ADR-005 §4.2, revisado 2026-08-04).
# Provisiona o cron + scripts. Roda 03:00 BRT (definido em group_vars).
#
# Cada ambiente tem bucket e credencial próprios (`r2_bucket` + token escopado
# nesse bucket): um token vazado em homologação não alcança os backups de
# produção. Ver defonline-docs/.../runbook-backup-r2.md para criá-los.

- name: Provisionar backup diário Postgres → GPG → Cloudflare R2
  hosts: homolog
  become: true
  gather_facts: true

  tasks:
    - name: Pacotes para backup
      ansible.builtin.apt:
        name:
          - gnupg
          - cron
          - curl                       # canal de alerta (Telegram Bot API)
        state: present

    # rclone NÃO vem do apt de propósito. O Ubuntu 26.04 empacota a 1.60.1-DEV
    # (build de 2022), que quebra contra a R2: o PUT do objeto responde 200 com
    # um `x-amz-version-id`, a 1.60 refaz o HEAD de verificação com
    # `?versionId=<id>`, e a R2 devolve 501 Not Implemented — ela não implementa
    # versionamento de objeto. O upload já tinha ido; só a releitura falha.
    # Efeito perverso: o `rclone copyto` errava na 1ª tentativa e acertava na 2ª,
    # então o backup terminava com "Backup ok." e escondia o erro no log. Se as
    # 3 tentativas caíssem juntas, a falha seria silenciosa às 03:00.
    # Reproduzido e corrigido em 2026-08-04 (IDR-012); a 1.75.0 sobe limpo.
    - name: Versão do rclone instalada
      ansible.builtin.command: rclone version
      register: rclone_version_out
      changed_when: false
      failed_when: false

    - name: Instalar rclone {{ rclone_version }} (pacote oficial upstream)
      ansible.builtin.apt:
        deb: >-
          https://downloads.rclone.org/v{{ rclone_version }}/rclone-v{{ rclone_version }}-linux-{{
          'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}.deb
      when: ('rclone v' ~ rclone_version) not in (rclone_version_out.stdout | default(''))

    - name: Diretórios para backup local + chave GPG
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"
      loop:
        - "{{ deploy_dir }}/backups"
        - "/home/{{ deploy_user }}/.config/rclone"
        - "/home/{{ deploy_user }}/.gnupg"

    - name: Rclone.conf (Cloudflare R2)
      ansible.builtin.template:
        src: templates/rclone.conf.j2
        dest: "/home/{{ deploy_user }}/.config/rclone/rclone.conf"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      no_log: true

    # Falha aqui vale mais que falha às 03:00 num log que ninguém lê: valida de
    # uma vez credencial, endpoint e existência do bucket.
    - name: Validar acesso ao bucket R2
      ansible.builtin.command:
        cmd: rclone lsjson "r2:{{ r2_bucket }}" --max-depth 1
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: false

    - name: Scripts de backup e de verificação
      ansible.builtin.template:
        src: "templates/{{ item }}.j2"
        dest: "{{ deploy_dir }}/scripts/{{ item }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"
      loop:
        - pg-backup.sh
        - pg-backup-verify.sh

    - name: GPG passphrase em arquivo local (chmod 600)
      ansible.builtin.copy:
        dest: "/home/{{ deploy_user }}/.backup-gpg-pass"
        content: "{{ backup_gpg_passphrase }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      no_log: true

    # Credencial do Telegram em arquivo próprio (0600) em vez de embutida nos
    # scripts: os scripts são artefato de deploy, versionado e legível; o segredo
    # não. Mesmo padrão do .backup-gpg-pass.
    - name: Credencial do Telegram para os alertas (chmod 600)
      ansible.builtin.copy:
        dest: "/home/{{ deploy_user }}/.backup-telegram"
        content: |
          TELEGRAM_BOT_TOKEN={{ telegram_bot_token }}
          TELEGRAM_CHAT_ID={{ telegram_chat_id }}
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      no_log: true

    - name: Cron diário do backup (horário em group_vars/all.yml)
      ansible.builtin.cron:
        name: defonline-pg-backup
        user: "{{ deploy_user }}"
        minute: "{{ backup_cron_minute }}"
        hour: "{{ backup_cron_hour }}"
        job: "{{ deploy_dir }}/scripts/pg-backup.sh >> {{ deploy_dir }}/backups/backup.log 2>&1"

    # Roda depois da janela do backup. É o que cobra a AUSÊNCIA de execução —
    # cenário que o próprio pg-backup.sh, por definição, não consegue alertar.
    - name: Cron diário da verificação
      ansible.builtin.cron:
        name: defonline-pg-backup-verify
        user: "{{ deploy_user }}"
        minute: "{{ backup_verify_cron_minute }}"
        hour: "{{ backup_verify_cron_hour }}"
        job: "{{ deploy_dir }}/scripts/pg-backup-verify.sh >> {{ deploy_dir }}/backups/backup.log 2>&1"
