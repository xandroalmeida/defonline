---
# Restore de backup (ADR-005 §4.2 — RTO ~4h, exercitado trimestralmente).
#
# Diário:  ansible-playbook -i inventories/homolog playbooks/restore.yml -e dump_date=YYYYMMDD-HHMM
# Mensal:  ansible-playbook -i inventories/homolog playbooks/restore.yml -e dump_month=YYYYMM
#
# Para listar o que existe na R2 antes de escolher:
#   ssh deploy@<vps> 'rclone tree r2:defonline-backup-homolog/postgres/homolog'
#
# CUIDADO: este playbook DROPA o banco atual antes de restaurar. Confirmação manual obrigatória.

- name: Restaurar backup Postgres
  hosts: homolog
  become: true
  gather_facts: true
  vars_prompt:
    - name: confirm
      prompt: "Vai DROPAR a base atual do ambiente alvo. Digite 'RESTAURAR' para confirmar"
      private: false

  pre_tasks:
    - name: Abortar se confirmação não bate
      ansible.builtin.fail:
        msg: "Confirmação inválida."
      when: confirm != 'RESTAURAR'

    - name: Validar que dump_date OU dump_month foi passado
      ansible.builtin.fail:
        msg: "Passe -e dump_date=YYYYMMDD-HHMM (diário) ou -e dump_month=YYYYMM (mensal)."
      when: dump_date is not defined and dump_month is not defined

  tasks:
    # Os dois prefixos criados pelo pg-backup.sh têm layouts distintos:
    #   daily/YYYY/MM/dump-YYYYMMDD-HHMM.sql.gz.gpg
    #   monthly/YYYY/dump-YYYYMM.sql.gz.gpg
    - name: Resolver caminho remoto e nome local do dump
      ansible.builtin.set_fact:
        dump_id: "{{ dump_date | default(dump_month) }}"
        dump_remote: >-
          {%- if dump_date is defined -%}
          r2:{{ r2_bucket }}/postgres/{{ env_name }}/daily/{{ dump_date[:4] }}/{{ dump_date[4:6] }}/dump-{{ dump_date }}.sql.gz.gpg
          {%- else -%}
          r2:{{ r2_bucket }}/postgres/{{ env_name }}/monthly/{{ dump_month[:4] }}/dump-{{ dump_month }}.sql.gz.gpg
          {%- endif -%}

    - name: Download do dump cifrado da R2
      ansible.builtin.command:
        cmd: >-
          rclone copyto
          {{ dump_remote }}
          {{ deploy_dir }}/backups/dump-{{ dump_id }}.sql.gz.gpg
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: true

    - name: Decifrar + descomprimir + restaurar
      ansible.builtin.shell: |
        set -euo pipefail
        cd {{ deploy_dir }}
        gpg --batch --yes --decrypt \
            --passphrase-file /home/{{ deploy_user }}/.backup-gpg-pass \
            backups/dump-{{ dump_id }}.sql.gz.gpg \
          | gunzip \
          | docker compose exec -T db pg_restore \
              --username={{ postgres_superuser }} \
              --dbname={{ postgres_db }} \
              --clean \
              --if-exists \
              --no-owner \
              --no-acl
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: true
