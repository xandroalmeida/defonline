; Hardening contra PHP2Shell (CVE-2026-109618/109619) e CVE-2026-115560.
; Defesa em profundidade: a correção real é o PHP >= 8.5.12, garantido no
; Dockerfile. Estas diretivas desligam o estado que sobrevive entre requests
; no processo do `php artisan serve`.

; CVE-2026-109619 (upload) e CVE-2026-115560: o app não usa upload progress.
session.upload_progress.enabled = 0

; CVE-2026-109619 (backtrace de erro fatal, só PHP 8.5).
fatal_error_backtraces = 0

; Sem o Caddyfile próprio (ADR-009), o limite de corpo fica no PHP: o app não
; aceita upload de arquivo; forms/Livewire ficam bem abaixo disso.
post_max_size = 2M
upload_max_filesize = 2M

; Não anuncia a versão do PHP (o Caddy próprio removia o header Server).
expose_php = Off
