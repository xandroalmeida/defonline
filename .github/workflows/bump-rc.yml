name: bump-rc — sugere a próxima tag de release-candidate

# ADR-006 §1.4 — helper de versão. Calcula a próxima tag vX.Y.Z-rc.N e imprime o
# comando para você criá-la LOCALMENTE.
#
# O deploy de homolog é disparado pelo PUSH da tag no git (release-homolog.yml
# `on: push: tags`). Tag criada por bot (GITHUB_TOKEN) NÃO dispara deploy — regra
# anti-recursão do GitHub. Por isso este workflow NÃO cria a tag: só sugere. Rode o
# comando no seu terminal para que o push (com sua credencial) dispare o release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de incremento'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calcular e sugerir a próxima tag
        run: |
          last_release=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1 || true)
          if [ -z "$last_release" ]; then
              MAJ=0; MIN=1; PAT=0
          else
              CLEAN="${last_release#v}"
              CLEAN="${CLEAN%%-*}"
              IFS='.' read -r MAJ MIN PAT <<< "$CLEAN"
          fi

          case "${{ inputs.bump }}" in
              major) MAJ=$((MAJ + 1)); MIN=0; PAT=0;;
              minor) MIN=$((MIN + 1)); PAT=0;;
              patch) PAT=$((PAT + 1));;
          esac

          BASE="v${MAJ}.${MIN}.${PAT}"
          # Acha o próximo -rc.N livre para essa BASE.
          RC=1
          while git tag --list "${BASE}-rc.${RC}" | grep -q "${BASE}-rc.${RC}"; do
              RC=$((RC + 1))
          done
          NEW_TAG="${BASE}-rc.${RC}"

          echo "Próxima tag sugerida: ${NEW_TAG}"
          {
            echo "## Próxima tag rc: \`${NEW_TAG}\`"
            echo ""
            echo "Rode no seu terminal — o **push da tag** dispara o deploy de homolog:"
            echo '```bash'
            echo "git tag ${NEW_TAG}"
            echo "git push origin ${NEW_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
