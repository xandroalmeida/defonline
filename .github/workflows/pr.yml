name: PR — lint + segurança + Unit puros

# ADR-006 §3.1 — Pipeline de PR. Jobs em paralelo; falha em qualquer um = bloqueio.
#
# Revisado 2026-08 (agilidade): o CI passou a ser o dono da cobertura E do Dusk.
# Antes a cobertura + Dusk viviam no pre-push local (caminho crítico, minutos). Agora
# `test-coverage` (Postgres + pcov) e `test-dusk` (Postgres + Chromium) rodam aqui, em
# paralelo e fora da máquina do dev. O pre-push ficou enxuto (Pint+Larastan+Pest sem
# cobertura) e proporcional ao diff. Ver scripts/git-hooks/pre-push.sh.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Permite ser chamado como reusable workflow por main.yml e release-*.yml.
  workflow_call:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-php:
    name: Pint (lint)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, zip, bcmath, intl, mbstring
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('app/composer.lock') }}
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: ./vendor/bin/pint --test

  lint-static:
    name: Larastan (PHPStan nível 6)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, zip, bcmath, intl, mbstring
          coverage: none
      - uses: actions/cache@v4
        with:
          path: app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('app/composer.lock') }}
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  lint-pr-title:
    # ADR-006 §1.3: Conventional Commits aplica-se ao squash final (título do PR vira
    # commit). NÃO validamos cada commit do histórico — só o título do PR.
    name: Conventional Commits (PR title)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            ci
            build
            revert
          requireScope: false
          subjectPatternError: |
            O título do PR deve ser Conventional Commits.
            Ex.: "feat: adicionar pre-push hook" — sem letra maiúscula no início do subject.

  test-unit-pure:
    name: Pest UnitPure (sem DB)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, zip, bcmath, intl, mbstring
          coverage: none
      - uses: actions/cache@v4
        with:
          path: app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('app/composer.lock') }}
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: php artisan test --testsuite=UnitPure

  test-coverage:
    # STORY-010 CA-3/4 — gate de cobertura no PR.
    #
    # Roda Pest All (UnitPure + Feature) com PCOV contra Postgres real (mesmo padrão
    # que release-homolog.yml usa). Falha o PR se a cobertura geral cair abaixo de 80%,
    # ou se app/Domain (quando existir) cair abaixo de 98% — gates prescritos em
    # ADR-006 §3.1 + quality-standards §1.1+§2.2.
    #
    # Artefato coverage-summary.txt é publicado em qualquer resultado (success/failure)
    # para auditoria e debugging.
    name: Pest All (coverage ≥80%)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: defonline
          POSTGRES_PASSWORD: defonline
          # `defonline_test` (não `defonline`) para casar com o override
          # `DB_DATABASE` forçado em app/phpunit.xml. Em local existem dois
          # bancos (defonline para smoke manual + defonline_test para testes);
          # CI só roda testes, então só precisa do banco de teste.
          POSTGRES_DB: defonline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U defonline -d defonline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: defonline_test
      DB_USERNAME: defonline
      DB_PASSWORD: defonline
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, zip, bcmath, intl, mbstring
          coverage: pcov
      - uses: actions/cache@v4
        with:
          path: app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('app/composer.lock') }}
      - run: composer install --prefer-dist --no-progress --no-interaction

      # STORY-019/024 — views autenticadas e a landing pública consomem `@vite(['resources/css/app.css', 'resources/js/app.js'])`.
      # Sem manifest no `public/build/`, qualquer feature test que renderize view explode com ViteManifestNotFoundException → 500.
      # `public/build/` é gitignored; CI precisa buildar antes do Pest.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Gera .env e .env.testing apontando para o Postgres do service
        # Laravel detecta APP_ENV=testing (do phpunit.xml) e carrega .env.testing
        # — então o `.env.testing` versionado (mira Dusk local contra web-test +
        # Mailpit) é sobrescrito aqui com providers in-memory (CI não tem
        # mailpit/redis). O `.env` é gerado também porque artisan key:generate
        # e similares leem dele.
        run: |
          # APP_KEY fixo do CI — runner ephemeral, sem dado real. Evita a
          # dança `key:generate --env=testing` (que precisaria de --env em
          # cada artisan posterior). Mesmo valor do .env.dusk.local/.env local.
          ENV_BODY='APP_NAME=DEFOnline
          APP_ENV=testing
          APP_KEY=base64:7gf3GPBbCPBAFBDe0OJnHWkXyTkT5LnIXYA+7QIwqHg=
          APP_DEBUG=true
          APP_URL=http://localhost
          APP_VERSION=ci
          LOG_CHANNEL=stack
          LOG_STACK=daily
          LOG_LEVEL=debug
          LOG_DAILY_DAYS=1
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=defonline_test
          DB_USERNAME=defonline
          DB_PASSWORD=defonline
          SESSION_DRIVER=array
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_CONNECTION=null
          TELEGRAM_BOT_TOKEN=
          PULSE_ENABLED=false
          TELESCOPE_ENABLED=false
          NIGHTWATCH_ENABLED=false'
          printf '%s\n' "$ENV_BODY" > .env
          printf '%s\n' "$ENV_BODY" > .env.testing

      - name: Habilita extensões Postgres (IDR-001 — normalmente initdb script)
        env:
          PGPASSWORD: defonline
        run: |
          psql -h 127.0.0.1 -U defonline -d defonline_test -v ON_ERROR_STOP=1 -c "
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS citext;
            CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          "

      - name: Migrate (APP_KEY já fixo no .env.testing)
        run: |
          php artisan migrate --force

      - name: Pest All com --coverage --min=80
        # `./vendor/bin/pest` direto (não `php artisan test`) porque o wrapper do
        # artisan engole o exit code do gate de cobertura do Pest 4.7. tee preserva o
        # exit code do pest via PIPESTATUS.
        run: |
          set -o pipefail
          ./vendor/bin/pest --testsuite=All --coverage --min=80 | tee coverage-summary.txt

      - name: Gate adicional ≥98% em app/Domain (quando a pasta existir)
        if: hashFiles('app/Domain/**/*.php') != ''
        run: |
          set -o pipefail
          ./vendor/bin/pest --configuration=phpunit-domain.xml --coverage --min=98 | tee -a coverage-summary.txt

      - name: Upload coverage-summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: app/coverage-summary.txt
          if-no-files-found: warn
          retention-days: 30

  test-dusk:
    # Dusk E2E migrado do pre-push para o CI (revisão 2026-08). Mesmo setup do
    # test-coverage (Postgres service + npm build + migrate), servindo o app com
    # `artisan serve` e batendo com Chromium headless — o mesmo padrão do job de
    # smoke pós-deploy do release-homolog.yml.
    name: Dusk E2E (browser)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: defonline
          POSTGRES_PASSWORD: defonline
          POSTGRES_DB: defonline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U defonline -d defonline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # EmailConfirmacaoBrowserTest lê a caixa via HTTP API do Mailpit (hostname
      # `mailpit` hardcoded no teste — resolvido via /etc/hosts abaixo).
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: defonline_test
      DB_USERNAME: defonline
      DB_PASSWORD: defonline
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, zip, bcmath, intl, mbstring
          coverage: none
      - uses: actions/cache@v4
        with:
          path: app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('app/composer.lock') }}
      - run: composer install --prefer-dist --no-progress --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      # O teste de email bate em http://mailpit:8025 (hostname fixo). O job roda no
      # host do runner (não em container), então o service Mailpit fica em 127.0.0.1
      # — este alias faz o nome `mailpit` resolver para lá (SMTP 1025 + API 8025).
      - name: Alias mailpit -> 127.0.0.1
        run: echo "127.0.0.1 mailpit" | sudo tee -a /etc/hosts

      - name: Gera .env e .env.testing (Postgres + Mailpit dos services)
        run: |
          # SESSION/CACHE em database (NÃO array): o serve roda com múltiplos workers
          # (PHP_CLI_SERVER_WORKERS) p/ suportar o XHR do Livewire durante o request;
          # com array, cada worker teria sessão isolada e o login não persistiria.
          ENV_BODY='APP_NAME=DEFOnline
          APP_ENV=testing
          APP_KEY=base64:7gf3GPBbCPBAFBDe0OJnHWkXyTkT5LnIXYA+7QIwqHg=
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8000
          APP_VERSION=ci
          LOG_CHANNEL=stack
          LOG_STACK=daily
          LOG_LEVEL=debug
          LOG_DAILY_DAYS=1
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=defonline_test
          DB_USERNAME=defonline
          DB_PASSWORD=defonline
          SESSION_DRIVER=database
          CACHE_STORE=database
          QUEUE_CONNECTION=sync
          MAIL_MAILER=smtp
          MAIL_HOST=mailpit
          MAIL_PORT=1025
          MAIL_FROM_ADDRESS=hello@defonline.local
          BROADCAST_CONNECTION=null
          TELEGRAM_BOT_TOKEN=
          PULSE_ENABLED=false
          TELESCOPE_ENABLED=false
          NIGHTWATCH_ENABLED=false'
          printf '%s\n' "$ENV_BODY" > .env
          printf '%s\n' "$ENV_BODY" > .env.testing

      - name: Habilita extensões Postgres (IDR-001 — normalmente initdb script)
        env:
          PGPASSWORD: defonline
        run: |
          psql -h 127.0.0.1 -U defonline -d defonline_test -v ON_ERROR_STOP=1 -c "
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS citext;
            CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          "

      - name: Migrate
        run: php artisan migrate --force

      - uses: browser-actions/setup-chrome@v1

      - name: Serve app + Dusk (Chromium headless)
        env:
          APP_URL: http://127.0.0.1:8000
          DUSK_DRIVER_URL: http://localhost:9515
          # --no-reload é exigido pelo artisan serve p/ honrar múltiplos workers.
          PHP_CLI_SERVER_WORKERS: '5'
        run: |
          php artisan serve --no-reload --host=127.0.0.1 --port=8000 >/tmp/serve.log 2>&1 &
          until curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; do sleep 1; done
          chromedriver --port=9515 --whitelisted-ips='' >/tmp/chromedriver.log 2>&1 &
          sleep 3
          php artisan dusk || { echo '--- serve.log ---'; cat /tmp/serve.log; echo '--- chromedriver.log ---'; cat /tmp/chromedriver.log; exit 1; }

  security-deps:
    name: composer audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer audit --locked

  security-image:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'app/vendor,app/node_modules,app/storage'

  security-secrets:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  arch-no-pgadmin-in-ansible:
    # STORY-009 CA-10 — bloqueia merge se algum playbook/role Ansible referenciar
    # pgadmin / phppgadmin / adminer / dbgate. Ferramentas administrativas são
    # DEV LOCAL APENAS (ADR-005 §1.1, §6, §7.5).
    name: Arch — sem pgAdmin/Adminer em Ansible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-no-pgadmin-in-ansible.sh

  flags-check:
    name: Feature flags (overdue)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    continue-on-error: true # warning, não bloqueia merge (ADR-006 §3.1)
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, zip, bcmath, intl, mbstring
          coverage: none
      - uses: actions/cache@v4
        with:
          path: app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('app/composer.lock') }}
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: php artisan pennant:list-overdue
